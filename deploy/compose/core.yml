# region: compose-postgres
name: llmdata
x-pg: &pg
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: llmdata
  PGPASSWORD: ${POSTGRES_PASSWORD:?run make up}
services:
  postgres:
    image: ${POSTGRES_IMAGE:?pass --env-file images.env}
    environment:
      POSTGRES_USER: llmdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make up}
      POSTGRES_DB: llmdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmdata -d llmdata"]
      interval: 5s
      retries: 30
# endregion
# region: compose-airflow
  airflow:
    image: llmdata-airflow:local
    build:
      context: ../..
      dockerfile: deploy/airflow/Dockerfile
      args:
        AIRFLOW_BASE: ${AIRFLOW_BASE:?pass --env-file images.env}
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres: {condition: service_healthy}
    env_file: airflow.env
    environment:
      <<: *pg
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      LLMDATA_UNTIL: ${UNTIL:-ch20}
      LLMDATA_PROFILE: ${PROFILE:-}
    volumes:
      - ../../src:/opt/llmdata/src:ro
      - ../../dags:/opt/airflow/dags:ro
      - ../../pipelines:/opt/llmdata/pipelines:ro
      - ../../data:/opt/llmdata/data
      - models:/opt/llmdata/models
    ports: ["127.0.0.1:8080:8080"]
volumes:
  pgdata:
  models:
# endregion
