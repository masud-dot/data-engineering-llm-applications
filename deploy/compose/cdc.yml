# The cdc profile: Debezium reads the claims table from the
# write-ahead log and publishes each change to Kafka.
# make up PROFILE=cdc adds this file to the core one.
# region: cdc-compose
services:
  postgres:
    command: ["postgres", "-c", "wal_level=logical"]
  kafka:
    image: ${KAFKA_IMAGE:?pass --env-file images.env}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes:
      - kafka:/var/lib/kafka/data
  connect:
    image: ${DEBEZIUM_IMAGE:?pass --env-file images.env}
    depends_on:
      kafka: {condition: service_started}
      postgres: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: llmdata-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: >-
        org.apache.kafka.common.config.provider.EnvVarConfigProvider
      HEAP_OPTS: -Xms256m -Xmx512m
      PGPASSWORD: ${POSTGRES_PASSWORD:?run make up}
volumes:
  kafka:
# endregion
