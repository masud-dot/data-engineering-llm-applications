name: ci
on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
defaults:
  run:
    shell: bash  # -eo pipefail: a failure before | tee fails the step
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:  # the image pinned in versions.toml
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: llmdata
          POSTGRES_DB: llmdata
          POSTGRES_HOST_AUTH_METHOD: trust  # a throwaway database
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U llmdata"
          --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: llmdata
      LLMDATA_REQUIRE_DB: "1"  # a test that needs it fails, not skips
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv sync --frozen 2>&1 | tee -a ci.log
      - run: |
          uv run --frozen python -m llmdata.db migrate 2>&1 | tee -a ci.log
          psql -d llmdata -c "CREATE DATABASE source" 2>&1 | tee -a ci.log
      - run: make lint types 2>&1 | tee -a ci.log
      - run: uv run --frozen pytest -q -rs 2>&1 | tee -a ci.log
      - name: DAG import test against Airflow 3.3.2
        run: >-
          uv run --frozen --with apache-airflow==3.3.2
          pytest -q tests/integration/test_dag_import.py 2>&1
          | tee -a ci.log
      - name: Spark job in local mode
        run: >-
          uv run --frozen --extra spark pytest -q tests/spark 2>&1
          | tee -a ci.log
      - name: Parser spike (S-3)
        run: |
          uv run --frozen python -m llmdata.synthetic --files-only \
            2>&1 | tee -a ci.log
          uv run --frozen python tools/spike/parser_bench.py \
            2>&1 | tee -a ci.log
      - run: >-
          uv run --frozen python tools/check_listings.py --self-test
          2>&1 | tee -a ci.log
      - run: >-
          uv run --frozen python tools/check_versions.py --require-digests
          2>&1 | tee -a ci.log
      - name: Secret scan
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner 2>&1 | tee -a ci.log
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_report.py checks ci.log spike/s3.json
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: make spike
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci_report.py spike spike/summary.md
          spike/spike.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-results
          path: spike/
